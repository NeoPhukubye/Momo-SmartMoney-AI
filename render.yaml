# Render Blueprint for the SmartMoney AI backend.
#
# IMPORTANT: the live service (srv-dac7p63q87js73as87fg) was created MANUALLY in the
# Render dashboard, which means Render does NOT read this file for it. Environment
# variables and the start command must be set in the dashboard by hand.
#
# This file is kept accurate so the stack can be recreated from scratch as a Blueprint,
# and so it documents the intended configuration. It now matches the live service:
# Docker runtime, Frankfurt region.
#
# The frontend is hosted on GitHub Pages (neophukubye.github.io/Momo-SmartMoney-AI),
# so Render does not deploy it (saves free build minutes).

databases:
  - name: smartmoney-db
    plan: free
    databaseName: smartmoney
    user: smartmoney
    region: frankfurt
    postgresMajorVersion: "15"

services:
  - type: web
    name: momo-smartmoney-ai
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: frankfurt
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartmoney-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: MOMO_BASE_URL
        value: https://proxy.momoapi.mtn.com/collection
      - key: MOMO_TARGET_ENVIRONMENT
        value: mtnsouthafrica
      - key: MOMO_ENVIRONMENT
        value: mtnsouthafrica
      - key: MOMO_COLLECTION_PRIMARY_KEY
        sync: false
      - key: MOMO_DISBURSEMENT_KEY
        sync: false
      - key: MOMO_API_USER
        sync: false
      - key: MOMO_API_KEY
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_USERNAME
        value: sandbox
      - key: GOOGLE_CLIENT_IDS
        value: 930989766959-i76ac8irvvtl5qjgioi7ha32b3hl7it1.apps.googleusercontent.com
      - key: CORS_ORIGINS
        value: https://neophukubye.github.io,https://neophukubye.github.io/Momo-SmartMoney-AI,http://localhost:5173
