databases:
  - name: smartmoney-db
    plan: free
    databaseName: smartmoney
    user: smartmoney
    postgresMajorVersion: "15"

services:
  # Backend API only.
  # The frontend is hosted on GitHub Pages (neophukubye.github.io/Momo-SmartMoney-AI),
  # so Render does not deploy the frontend (saves free build minutes).
  - type: web
    name: smartmoney-api
    runtime: python
    pythonVersion: "3.11.9"
    plan: free
    region: oregon
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && gunicorn app.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120 --graceful-timeout 30 --keep-alive 65
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartmoney-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: MOMO_BASE_URL
        value: https://proxy.momoapi.mtn.com/collection
      - key: MOMO_TARGET_ENVIRONMENT
        value: mtnsouthafrica
      - key: MOMO_ENVIRONMENT
        value: mtnsouthafrica
      - key: MOMO_COLLECTION_PRIMARY_KEY
        sync: false
      - key: MOMO_DISBURSEMENT_KEY
        sync: false
      - key: MOMO_API_USER
        sync: false
      - key: MOMO_API_KEY
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_USERNAME
        value: sandbox
      - key: CORS_ORIGINS
        value: https://neophukubye.github.io,https://neophukubye.github.io/Momo-SmartMoney-AI,http://localhost:5173
    healthCheckPath: /health