databases:
  - name: smartmoney-db
    plan: free
    databaseName: smartmoney
    user: smartmoney
    postgresMajorVersion: "15"

services:
  # Backend API
  - type: web
    name: smartmoney-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartmoney-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: MOMO_COLLECTION_PRIMARY_KEY
        sync: false
      - key: MOMO_DISBURSEMENT_PRIMARY_KEY
        sync: false
      - key: MOMO_API_USER
        sync: false
      - key: MOMO_API_KEY
        sync: false
      - key: MOMO_ENVIRONMENT
        value: sandbox
      - key: AT_API_KEY
        sync: false
      - key: AT_USERNAME
        value: sandbox
      - key: CORS_ORIGINS
        value: https://neophukubye.github.io,http://localhost:5173
      - key: APP_ENV
        value: production
    healthCheckPath: /health

  # Frontend (Static Site)
  - type: web
    name: smartmoney-app
    runtime: static
    plan: free
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://smartmoney-api.onrender.com
      - key: VITE_APP_NAME
        value: SmartMoney AI
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
